name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. Superseded pull request runs are pointless, but a deploy must
# never be cancelled part-way through its SSH session, so main runs queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No `version` input: the action reads the exact pnpm from the
      # packageManager field, so CI cannot drift from local installs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Compile gate. Without it, a change that lints and type-checks but fails
      # to build is only caught after merge, inside the Docker build on main.
      # Placeholder values are enough: no route fetches the backend at build
      # time, but env.server.ts parses on import and requires GO_API_URL when
      # NODE_ENV is production, which is what `next build` sets.
      - name: Build
        env:
          AUTH_SECRET: build-only-secret-at-least-32-characters-long
          GO_API_URL: http://127.0.0.1:8080
        run: pnpm build

  build-app:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase paths, so derive the name instead of trusting the
      # repository slug to be lowercase.
      - name: Resolve image name
        id: name
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.value }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No build-args: this app ships no NEXT_PUBLIC_* values, so nothing
          # needs inlining at build time. Every runtime value and every secret
          # comes from .env.production on the droplet, loaded by compose via
          # env_file.

      # Hand the deploy job an immutable digest so it cannot drift from whatever
      # tag format the metadata action happens to emit.
      - name: Publish image reference
        id: image
        run: echo "ref=${{ steps.name.outputs.value }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # No `if` needed: `needs` already keeps this skipped whenever build-app is.
  deploy-to-prod:
    needs: build-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Pull and restart production image
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.build-app.outputs.image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_DIR: ${{ secrets.DO_APP_DIR }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          envs: IMAGE,GHCR_USERNAME,GHCR_TOKEN,APP_DIR
          script: |
            set -eu
            cd "$APP_DIR"

            # Runtime configuration is droplet-local and compose loads it with
            # env_file. Fail before restarting rather than starting a container
            # with no AUTH_SECRET.
            if [ ! -f .env.production ]; then
              echo ".env.production is missing in $APP_DIR"
              exit 1
            fi

            for required in AUTH_SECRET GO_API_URL; do
              if ! grep -Eq "^${required}=.+$" .env.production; then
                echo "$required is missing in $APP_DIR/.env.production"
                exit 1
              fi
            done

            COMPOSE_FILE=compose.production.yaml
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "$COMPOSE_FILE is missing in $APP_DIR"
              exit 1
            fi

            # compose declares FRONTEND_IMAGE as required, so persist the
            # deployed digest to .env (its default interpolation source).
            # Without this, every later `docker compose ps|logs|down` on the
            # droplet aborts on interpolation and rollback means hand-retyping a
            # digest. Existing keys in .env are preserved.
            # Built as a fresh file and renamed into place: writing .env
            # directly would fail if a previous run (or an operator) left it
            # owned by another user, and a rename only needs directory write
            # permission.
            if [ -f .env ]; then
              grep -v '^FRONTEND_IMAGE=' .env > .env.next || true
            else
              : > .env.next
            fi
            printf 'FRONTEND_IMAGE=%s\n' "$IMAGE" >> .env.next
            chmod 600 .env.next
            mv -f .env.next .env

            export FRONTEND_IMAGE="$IMAGE"
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE"
            docker compose -f "$COMPOSE_FILE" up -d --no-build

            # `up -d` exiting 0 only means the container started. Wait on the
            # Dockerfile HEALTHCHECK so a crash-looping image fails the deploy
            # instead of reporting success. Docker's 10s start period plus
            # three 30s health intervals can exceed one minute.
            CONTAINER="$(docker compose -f "$COMPOSE_FILE" ps -q app)"
            if [ -z "$CONTAINER" ]; then
              echo "app container was not created"
              docker compose -f "$COMPOSE_FILE" ps
              exit 1
            fi
            for attempt in $(seq 1 60); do
              STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo starting)"
              if [ "$STATUS" = healthy ]; then
                break
              fi
              if [ "$STATUS" = unhealthy ] || [ "$attempt" -eq 60 ]; then
                echo "app did not become healthy within 120s (last status: $STATUS)"
                docker compose -f "$COMPOSE_FILE" logs --tail=50 app
                exit 1
              fi
              sleep 2
            done

            docker image prune -f
